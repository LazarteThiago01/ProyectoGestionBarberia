<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Barbería Grupo 12</title>
    <!-- Bootstrap para el diseño -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

    <!-- BARRA DE NAVEGACIÓN -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="/">Barbería G12</a>
            <div class="navbar-nav ms-auto">
                {% if session.get('username') %}
                    <span class="navbar-text me-3">
                        Hola, <strong>{{ session['username'] }}</strong> 
                        <span class="badge bg-secondary">{{ session['rol'] }}</span>
                    </span>
                    
                    {% if session['rol'] == 'admin' %}
                        <a class="btn btn-outline-warning btn-sm me-2" href="/admin/peluqueros/">Panel Peluqueros</a>
                        <a class="btn btn-outline-warning btn-sm me-2" href="/turnos">Ver Turnos</a>
                    {% endif %}
                    
                    <a class="btn btn-danger btn-sm" href="/logout">Cerrar Sesión</a>
                {% else %}
                    <a class="nav-link" href="/login">Iniciar Sesión</a>
                    <a class="btn btn-primary btn-sm ms-2" href="/registro">Registrarse</a>
                {% endif %}
            </div>
        </div>
    </nav>

    <div class="container mt-5">
        <h1 class="text-center mb-4">Reserva tu Turno</h1>
        
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card shadow p-4">
                    <form action="/reservar" method="POST">
                        <div class="mb-3">
                            <label class="form-label">Nombre Completo</label>
                            <input type="text" name="nombre" class="form-control" placeholder="Ej: Juan Pérez" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Correo Electrónico</label>
                            <input type="email" name="email" class="form-control" placeholder="correo@ejemplo.com" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Elegí tu Peluquero</label>
                            <select name="peluquero" class="form-select" required>
                                <option value="" selected disabled>Seleccioná un profesional...</option>       
                                {% for p in peluqueros %}
                                    <option value="{{ p.nombre }}">{{ p.nombre }}</option>
                                {% endfor %}
                            </select>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Fecha y Hora</label>
                            <input type="datetime-local" name="fecha" class="form-control" required>
                        </div>
                        <button type="submit" class="btn btn-primary w-100">Reservar Turno</button>
                    </form>
                </div>
                
                <p class="text-center mt-4 text-muted small">
                    © 2024 Barbería Grupo 12 - Proyecto Final
                </p>
            </div>
        </div>
    </div>

    <!-- Script de Bootstrap para que funcionen los menús si hiciera falta -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
