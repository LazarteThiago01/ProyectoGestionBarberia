<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Barbería Burzaco - Bienvenido</title>
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #0b0f19; /* Fondo oscuro */
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        /* Tarjeta contenedora */
        .auth-card {
            background-color: #111827;
            width: 100%;
            max-width: 420px;
            padding: 35px 30px;
            border-radius: 12px;
            border: 1px solid #1f2937;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6);
        }

        .auth-header {
            text-align: center;
            margin-bottom: 25px;
        }

        .auth-header .logo {
            font-size: 32px;
            margin-bottom: 8px;
        }

        .auth-header h2 {
            font-size: 24px;
            font-weight: 600;
        }

        /* Selector de pestañas convertido en enlaces seguros */
        .tab-container {
            display: flex;
            background-color: #0b0f19;
            padding: 4px;
            border-radius: 8px;
            margin-bottom: 25px;
            border: 1px solid #1f2937;
        }

        .tab-link {
            flex: 1;
            text-align: center;
            text-decoration: none;
            color: #9ca3af;
            padding: 10px;
            font-size: 14px;
            font-weight: 600;
            border-radius: 6px;
            transition: all 0.2s ease;
        }

        /* Pestaña activa azul de tu captura */
        .tab-link.active {
            background-color: #2563eb;
            color: #ffffff;
        }

        /* Control de visualización por Jinja2 */
        .auth-form {
            display: block;
        }

        /* Inputs y etiquetas */
        .input-group {
            margin-bottom: 20px;
            display: flex;
            flex-direction: column;
        }

        .input-group label {
            font-size: 13px;
            color: #9ca3af;
            margin-bottom: 8px;
            font-weight: 500;
        }

        .input-group input {
            background-color: #0b0f19;
            border: 1px solid #374151;
            padding: 12px;
            border-radius: 8px;
            color: #ffffff;
            font-size: 15px;
            outline: none;
            transition: all 0.2s ease;
        }

        .input-group input:focus {
            border-color: #2563eb;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
        }

        /* Botón de acción */
        .btn-submit {
            background-color: #2563eb;
            color: #ffffff;
            border: none;
            width: 100%;
            padding: 14px;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s;
            margin-top: 10px;
        }

        .btn-submit:hover {
            background-color: #1d4ed8;
        }

        .footer-text {
            color: #6b7280;
            font-size: 12px;
            text-align: center;
            margin-top: 25px;
        }
    </style>
</head>
<body>

    <div class="auth-card">
        
        <div class="auth-header">
            <div class="logo">💈</div>
            <h2>Barbería Burzaco</h2>
            
        </div>

        <div class="tab-container">
            <a href="/?action=login" class="tab-link {% if request.args.get('action', 'login') == 'login' %}active{% endif %}">Iniciar Sesión</a>
            <a href="/?action=registro" class="tab-link {% if request.args.get('action') == 'registro' %}active{% endif %}">Registrarse</a>
        </div>

        {% if request.args.get('action') == 'registro' %}
            
            <form id="registro-form" class="auth-form" action="/registro" method="POST">
                <div class="input-group">
                    <label for="reg-usuario">Elegí tu Usuario</label>
                    <input type="text" id="reg-usuario" name="usuario" required placeholder="Ej: juan123" autocomplete="off">
                </div>

                <div class="input-group">
                    <label for="reg-password">Contraseña</label>
                    <input type="password" id="reg-password" name="password" required placeholder="Mínimo 6 caracteres">
                </div>

                <button type="submit" class="btn-submit">Crear Cuenta</button>
            </form>

        {% else %}
            
            <form id="login-form" class="auth-form" action="/login" method="POST">
                <div class="input-group">
                    <label for="login-usuario">Usuario</label>
                    <input type="text" id="login-usuario" name="usuario" required placeholder="Tu usuario" autocomplete="off">
                </div>

                <div class="input-group">
                    <label for="login-password">Contraseña</label>
                    <input type="password" id="login-password" name="password" required placeholder="••••••••">
                </div>

                <button type="submit" class="btn-submit">Ingresar</button>
            </form>

        {% endif %}

        <p class="footer-text">
            © 2026 Barbería Grupo 11- Proyecto Facultad
        </p>
    </div>

</body>
</html>
