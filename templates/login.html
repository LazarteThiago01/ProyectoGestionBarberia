<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Barber App - Iniciar Sesión</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* ==========================================================================
           VARIABLES DE COLOR (Misma identidad que el Dashboard)
           ========================================================================== */
        :root {
            --bg-principal: #0b0f19;       /* Fondo oscuro profundo de la pantalla */
            --bg-card: #111827;            /* Fondo del contenedor del login */
            --azul-acento: #2563eb;        /* Azul brillante del botón */
            --azul-hover: #3b82f6;         /* Azul claro para el estado hover/focus */
            --borde-input: #1f2937;        /* Borde inicial de los campos de texto */
            --texto-blanco: #f3f4f6;       /* Texto principal */
            --texto-gris: #9ca3af;         /* Etiquetas secundarias (Usuario/Contraseña) */
        }

        /* ==========================================================================
           ESTILOS BASE
           ========================================================================== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-principal);
            min-height: 100vh;
            display: flex;
            justify-content: center; /* Centra el login horizontalmente */
            align-items: center;     /* Centra el login verticalmente */
            padding: 20px;
        }

        /* ==========================================================================
           CONTENEDOR DEL LOGIN (CARD)
           ========================================================================== */
        .login-container {
            background-color: var(--bg-card);
            width: 100%;
            max-width: 420px; /* Ancho máximo idéntico al de tu captura */
            padding: 40px 30px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.03);
            text-align: center;
        }

        /* Encabezado del Login */
        .login-logo {
            font-size: 2.2rem;
            color: var(--texto-blanco);
            margin-bottom: 8px;
        }

        .login-logo i {
            color: var(--azul-hover);
            margin-right: 5px;
        }

        .login-title {
            font-size: 1.4rem;
            color: var(--texto-blanco);
            font-weight: 600;
            margin-bottom: 6px;
        }

        .login-subtitle {
            font-size: 0.9rem;
            color: var(--texto-gris);
            margin-bottom: 35px;
        }

        /* ==========================================================================
           FORMULARIO E INPUTS
           ========================================================================== */
        .form-group {
            text-align: left;
            margin-bottom: 22px;
        }

        .form-group label {
            display: block;
            font-size: 0.85rem;
            color: var(--texto-gris);
            margin-bottom: 8px;
            font-weight: 500;
        }

        /* Contenedor del input (para poder meter el ícono del ojo adentro) */
        .input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        .form-control {
            width: 100%;
            background-color: transparent;
            border: 1px solid var(--borde-input);
            border-radius: 8px;
            padding: 14px 16px;
            color: var(--texto-blanco);
            font-size: 0.95rem;
            outline: none;
            transition: all 0.2s ease;
        }

        /* Cuando el usuario hace clic para escribir (Focus) */
        .form-control:focus {
            border-color: var(--azul-hover);
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.15);
        }

        /* Ajuste de padding a la derecha para que el texto no pise el ícono del ojo */
        .form-control-password {
            padding-right: 45px;
        }

        /* El ícono del ojo para mostrar/ocultar contraseña */
        .toggle-password {
            position: absolute;
            right: 16px;
            color: var(--texto-gris);
            cursor: pointer;
            transition: color 0.2s ease;
        }

        .toggle-password:hover {
            color: var(--texto-blanco);
        }

        /* ==========================================================================
           BOTÓN DE ACCESO
           ========================================================================== */
        .btn-submit {
            width: 100%;
            background-color: var(--azul-acento);
            color: var(--texto-blanco);
            border: none;
            border-radius: 8px;
            padding: 14px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s ease;
            margin-top: 10px;
        }

        .btn-submit:hover {
            background-color: var(--azul-hover);
        }
    </style>
</head>
<body>

    <div class="login-container">
        
        <div class="login-logo">
            <i class="fa-solid fa-scissors"></i>
        </div>
        
        <h2 class="login-title">Barber App</h2>
        <p class="login-subtitle">Gestión de Turnos Integrada</p>

        <form>
            <div class="form-group">
                <label for="username">Usuario</label>
                <div class="input-wrapper">
                    <input type="text" id="username" name="username" class="form-control" autocomplete="off" required>
                </div>
            </div>

            <div class="form-group">
                <label for="password">Contraseña</label>
                <div class="input-wrapper">
                    <input type="password" id="password" name="password" class="form-control form-control-password" required>
                    <i class="fa-regular fa-eye toggle-password" id="eye-icon" onclick="togglePasswordVisibility()"></i>
                </div>
            </div>

            <button type="submit" class="btn-submit">Ingresar</button>
        </form>

    </div>

    <script>
        function togglePasswordVisibility() {
            const passwordInput = document.getElementById('password');
            const eyeIcon = document.getElementById('eye-icon');
            
            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                // Cambia el icono al ojo tachado
                eyeIcon.classList.remove('fa-eye');
                eyeIcon.classList.add('fa-eye-slash');
            } else {
                passwordInput.type = 'password';
                // Vuelve al icono del ojo normal
                eyeIcon.classList.remove('fa-eye-slash');
                eyeIcon.classList.add('fa-eye');
            }
        }
    </script>

</body>
</html>
