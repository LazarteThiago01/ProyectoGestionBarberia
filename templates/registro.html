<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Registro - Barbería</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/register.css') }}">
</head>
<body>
    <div class="page-bg">
        <div class="card">
            <h1>Crear tu cuenta</h1>
            <p class="small">¿Ya tenés cuenta? <a href="{{ url_for('login') }}">Iniciá sesión</a></p>

            <form method="POST" class="register-form">
                <label for="name">Nombre completo</label>
                <input id="name" name="name" type="text" placeholder="Tu nombre completo" required>

                <label for="email">Correo electrónico</label>
                <input id="email" name="email" type="email" placeholder="nombre@ejemplo.com" required>

                <label for="password">Contraseña</label>
                <input id="password" name="password" type="password" placeholder="Creá una contraseña" required>

                <button class="primary" type="submit">Crear cuenta</button>
            </form>

            <div class="divider">o registrate con</div>
            <div class="socials">
                <button class="social">Google</button>
                <button class="social">Facebook</button>
                <button class="social">Apple</button>
            </div>

            <p class="terms">Al registrarte aceptás nuestros <a href="#">Términos</a> y la <a href="#">Política de privacidad</a>.</p>
            <p class="back"><a href="{{ url_for('home') }}">Volver al inicio</a></p>
        </div>
    </div>
</body>
</html>
